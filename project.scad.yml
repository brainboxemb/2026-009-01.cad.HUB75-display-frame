paths:
  design_root: dsg
  build_root: bld
  render_root: dsg/openscad/render
  export_root: dsg/openscad/export

design:
  include_externals: false

build_engine:
  engine: scons

openscad:
  common_flags:
    - --enable=object-function
  render_flags:
    - --render
    - --projection=o
  image_size: [2560, 1440]
  design_image_size: [640, 480]

rendering:
  watermark:
    text: "© 2026 brainboxemb"

externals:
  - name: lib.scad.hub75
    required_file: openscad/p5-64x32-panel/hub75_p5_64x32_panel.scad
  - name: lib.scad.clamps
    required_file: openscad/tube-clamp/tube_clamp.scad
  - name: lib.scad.util
    required_file: openscad/inspection.scad
  - name: lib.scad.forge
    required_file: openscad/forge.scad
  - name: lib.scad.mechint
    required_file: openscad/sliding_dovetail.scad

verification:
  render_root: vrf/openscad
  image_size: [1280, 720]
  commands:
    - [bash, scripts/run-verification.sh]
    - [bash, scripts/build-verification-index.sh]
  output_root: vrf/out

publication:
  production:
    source_branch: main
    build_branch: prod/bld
    verification_branch: prod/vrf

  development:
    pr_branch_prefix: dev/pr

  tags:
    pattern: "v*"

  release:
    branch_prefix: rel
    tag_pattern: "v*"
