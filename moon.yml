workspace:
  inheritedTasks:
    include:
      - scad.docs
      - scad.build
      - scad.verify

tasks:
  scad.docs:
    inputs:
      - 'dsg/openscad/**/*.scad'
      - 'dsg/openscad/**/design/**'
      - 'dsg/openscad/ext/lib.scad.hub75'

  scad.build:
    inputs:
      - 'dsg/openscad/**/*.scad'
      - 'dsg/openscad/**/render.yml'
      - 'dsg/openscad/**/export.yml'
      - 'dsg/openscad/ext/lib.scad.hub75'

  scad.verify:
    inputs:
      - 'dsg/openscad/**/*.scad'
      - 'dsg/openscad/ext/lib.scad.hub75'
      - 'vrf/**'
      - 'scripts/**'
      - 'tools/tool.git-project'
