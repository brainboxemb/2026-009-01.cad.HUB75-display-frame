name: Prepare frame v0.0.2 release

on:
  pull_request:
    branches:
      - main
    types: [opened]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'feature/pr-37-v002-release-prep'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release-prep branch
        uses: actions/checkout@v4
        with:
          ref: feature/pr-37-v002-release-prep
          fetch-depth: 1

      - name: Prepare v0.0.2 changelog and README
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if '## v0.0.2\n' not in text:
              if text.count('## Unreleased\n') != 1:
                  raise SystemExit('expected exactly one Unreleased heading')
              text = text.replace('## Unreleased\n', '## v0.0.2\n', 1)
          marker = '### Changed\n\n'
          additions = (
              '- Finalize Migration 005 on released `tool.scad-project v0.14.8`, with the committed tool gitlink on exact source `85781a6b21a0f6a06d37be154fd9eb475ecaa2a4` and thin semantic Production/Release callers.\n'
              '- Retain `lib.scad.hub75 v0.1.5` while qualifying affected production, exact provenance, durable timing evidence, the README-only zero-runtime path and the immutable project-release flow.\n'
          )
          if additions not in text:
              if text.count(marker) < 1:
                  raise SystemExit('missing Changed section')
              text = text.replace(marker, marker + additions, 1)
          changelog.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = 'tool.scad-project  v0.14.3 / b86b2be325f64847b8d91b7f2596bfd4e4ffb7f2'
          new = 'tool.scad-project  v0.14.8 / 85781a6b21a0f6a06d37be154fd9eb475ecaa2a4'
          if old not in text and new not in text:
              raise SystemExit('README tool baseline marker not found')
          text = text.replace(old, new)
          text = text.replace(
              'Exact workflow SHA pinning avoids ambiguity in nested reusable workflows.',
              'Reusable workflow callers use the same released semantic tool ref, while the committed tool gitlink records the exact source commit.',
          )
          readme.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit release preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md
          git diff --cached --check
          git commit -m 'Prepare HUB75 frame v0.0.2 release'
          git push origin HEAD:feature/pr-37-v002-release-prep
