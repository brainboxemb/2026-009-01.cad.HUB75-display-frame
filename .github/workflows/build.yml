name: Build HUB75 display frame

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write
  packages: read

# A newer run for the same workflow/ref supersedes stale generated output.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: brainboxemb/tool.scad-project/.github/workflows/project-build.yml@v0.7.1
    with:
      artifact_name: hub75-display-frame-build
