name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write
  packages: read

jobs:
  build:
    # Keep only the newest run for this workflow and Git ref.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: brainboxemb/tool.scad-project/.github/workflows/project-build.yml@v0.7.1
    with:
      artifact_name: hub75-display-frame-build
