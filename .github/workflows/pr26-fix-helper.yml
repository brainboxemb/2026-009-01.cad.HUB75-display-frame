name: PR26 fix helper

on:
  push:
    branches:
      - feature/pr-26-corner-taper-thin-sections

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/pr-26-corner-taper-thin-sections
          fetch-depth: 0

      - name: Remove brittle design-doc patch from geometry helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pr26-apply-refinement.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = '          replace_once(design,\n'
          end_marker = '          # Replace the rear-fit half-space implementation and append orthogonal 0.10 mm slices.\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate design-doc patch block in PR26 helper')
          path.write_text(text[:start] + end_marker + text[end + len(end_marker):], encoding='utf-8')
          PY
          rm -f .github/workflows/pr26-fix-helper.yml

      - name: Commit helper correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: split PR26 geometry and design updates"
          git push origin HEAD:feature/pr-26-corner-taper-thin-sections
