name: PR26 run import fix

on:
  push:
    branches:
      - feature/pr-26-corner-taper-thin-sections

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pr-26-corner-taper-thin-sections
          fetch-depth: 0
      - run: python3 scripts/pr26_fix_import.py
      - name: Commit import fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: import corner taper helper"
          git push origin HEAD:feature/pr-26-corner-taper-thin-sections
