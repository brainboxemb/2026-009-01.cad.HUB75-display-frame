name: PR26 run patch

on:
  push:
    branches:
      - feature/pr-26-corner-taper-thin-sections

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/pr-26-corner-taper-thin-sections
          fetch-depth: 0

      - name: Apply staged corner refinement
        shell: bash
        run: python3 scripts/pr26_apply.py

      - name: Commit permanent PR changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine corner taper and fit verification"
          git push origin HEAD:feature/pr-26-corner-taper-thin-sections
