name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dsg/**"
      - "vrf/**"
      - "scripts/**"
      - "project.yml"
      - ".gitmodules"
      - "tools/tool.scad-project"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "dsg/**"
      - "vrf/**"
      - "scripts/**"
      - "project.yml"
      - ".gitmodules"
      - "tools/tool.scad-project"
      - ".github/workflows/verify.yml"

permissions:
  contents: write
  packages: read

jobs:
  verify:
    # Keep only the newest run for this workflow and Git ref.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: brainboxemb/tool.scad-project/.github/workflows/project-verify.yml@19f38a6cf283e281ca7b9ab6ef8397740afe6fbf
