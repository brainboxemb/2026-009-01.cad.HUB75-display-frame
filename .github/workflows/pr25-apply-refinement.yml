name: PR25 apply refinement

on:
  push:
    branches:
      - feature/pr-25-horizontal-edge-reinforcement-outline
    paths:
      - ".github/workflows/pr25-apply-refinement.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v4
        with:
          ref: feature/pr-25-horizontal-edge-reinforcement-outline
          fetch-depth: 0

      - name: Apply source and documentation refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          source_path = root / 'dsg/openscad/project_components/horizontal-edge-coupler/hub75_horizontal_edge_coupler.scad'
          adapter_path = root / 'dsg/openscad/project_components/horizontal-edge-coupler/hub75_horizontal_edge_coupler_render.scad'
          design_path = root / 'dsg/openscad/project_components/horizontal-edge-coupler/design/design.md'
          changelog_path = root / 'CHANGELOG.md'
          note_path = root / 'dsg/openscad/project_components/horizontal-edge-coupler/design/pr-25-refinement.md'
          workflow_path = root / '.github/workflows/pr25-apply-refinement.yml'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          source = source_path.read_text()

          insertion_marker = '''\n\n// ----------------------------------------------------------------------\n// Base and functional cutters\n// ----------------------------------------------------------------------\n'''
          structural_helpers = '''\n\n// ----------------------------------------------------------------------\n// Reinforcement support envelope\n// ----------------------------------------------------------------------\n\nfunction hub75_horizontal_edge_coupler_reinforcement_relief_diameter(coupler) =\n    coupler.reinforcement_bushing_outer_diameter\n    + 2 * coupler.reinforcement_bushing_clearance;\n\nfunction hub75_horizontal_edge_coupler_reinforcement_support_diameter(coupler) =\n    hub75_horizontal_edge_coupler_reinforcement_relief_diameter(coupler)\n    + 2 * coupler.wall_thickness;\n\nmodule _hub75_horizontal_edge_coupler_reinforcement_support_envelope_2d(coupler) {\n    support_d =\n        hub75_horizontal_edge_coupler_reinforcement_support_diameter(coupler);\n\n    for (position =\n        _hub75_horizontal_edge_coupler_reinforcement_positions(coupler)\n    )\n        translate(position)\n            circle(d = support_d);\n}\n\nmodule _hub75_horizontal_edge_coupler_structural_profile_2d(coupler) {\n    // The normal T remains the family shape. The reinforcement envelope only\n    // contributes where that T would otherwise leave less than one configured\n    // wall thickness around the physical bushing clearance.\n    union() {\n        _hub75_horizontal_edge_coupler_profile_2d(coupler);\n        _hub75_horizontal_edge_coupler_reinforcement_support_envelope_2d(coupler);\n    }\n}\n'''
          source = replace_once(
              source,
              insertion_marker,
              structural_helpers + insertion_marker,
              'insert structural reinforcement helpers'
          )

          old_base = '''module _hub75_horizontal_edge_coupler_base_solid(coupler) {\n    _hub75_horizontal_edge_coupler_extrude_xz_y(\n        0,\n        coupler.base_thickness\n    )\n        _hub75_horizontal_edge_coupler_profile_2d(coupler);\n}\n'''
          new_base = '''module _hub75_horizontal_edge_coupler_base_solid(coupler) {\n    _hub75_horizontal_edge_coupler_extrude_xz_y(\n        0,\n        coupler.base_thickness\n    )\n        _hub75_horizontal_edge_coupler_structural_profile_2d(coupler);\n}\n'''
          source = replace_once(source, old_base, new_base, 'base structural profile')

          old_raw_shell = '''module _hub75_horizontal_edge_coupler_raw_guide_shell_2d(coupler) {\n    difference() {\n        _hub75_horizontal_edge_coupler_profile_2d(coupler);\n\n        offset(delta = coupler.fit_clearance)\n            _hub75_horizontal_edge_coupler_panel_keepout_2d(coupler);\n    }\n}\n'''
          new_raw_shell = '''module _hub75_horizontal_edge_coupler_raw_guide_shell_2d(coupler) {\n    difference() {\n        // Start from the structural profile so the small preset can carry a\n        // full wall around the reinforcement clearance. The expanded panel\n        // keep-out below still prevents the support envelope from re-entering\n        // the physical rail geometry.\n        _hub75_horizontal_edge_coupler_structural_profile_2d(coupler);\n\n        offset(delta = coupler.fit_clearance)\n            _hub75_horizontal_edge_coupler_panel_keepout_2d(coupler);\n    }\n}\n'''
          source = replace_once(source, old_raw_shell, new_raw_shell, 'guide structural profile')

          old_relief_d = '''                        d =\n                            coupler.reinforcement_bushing_outer_diameter\n                            + 2 * coupler.reinforcement_bushing_clearance,\n'''
          new_relief_d = '''                        d =\n                            hub75_horizontal_edge_coupler_reinforcement_relief_diameter(\n                                coupler\n                            ),\n'''
          source = replace_once(source, old_relief_d, new_relief_d, 'guide relief diameter')
          source_path.write_text(source)

          adapter = adapter_path.read_text()
          adapter = replace_once(
              adapter,
              '''    relief_diameter =\n        coupler.reinforcement_bushing_outer_diameter\n        + 2 * coupler.reinforcement_bushing_clearance;\n''',
              '''    relief_diameter =\n        hub75_horizontal_edge_coupler_reinforcement_relief_diameter(coupler);\n''',
              'adapter relief diameter'
          )
          adapter = replace_once(
              adapter,
              '''    medium = hub75_horizontal_edge_coupler_create_for_size(size = "medium");\n    large = hub75_horizontal_edge_coupler_create_for_size(size = "large");\n    coupler = view == "locator-pin-clearance" ? large : medium;\n''',
              '''    small = hub75_horizontal_edge_coupler_create_for_size(size = "small");\n    medium = hub75_horizontal_edge_coupler_create_for_size(size = "medium");\n    large = hub75_horizontal_edge_coupler_create_for_size(size = "large");\n    coupler =\n        view == "locator-pin-clearance"\n            ? large\n            : view == "reinforcement-support-profile"\n                ? small\n                : medium;\n''',
              'adapter preset selection'
          )
          profile_t_branch = '''    } else if (view == "profile-t") {\n        color(existing_transparent)\n            _hub75_horizontal_edge_design_thin(-0.42, -0.02)\n                _hub75_horizontal_edge_coupler_plus_profile_2d(coupler);\n        color(current)\n            _hub75_horizontal_edge_design_thin(0.02, 0.42)\n                _hub75_horizontal_edge_coupler_profile_2d(coupler);\n\n'''
          support_branch = profile_t_branch + '''    } else if (view == "reinforcement-support-profile") {\n        // This explanatory state deliberately uses the small preset, where the\n        // required support envelope first extends beyond the normal T profile.\n        color(existing)\n            _hub75_horizontal_edge_design_thin(-0.42, -0.02)\n                _hub75_horizontal_edge_coupler_profile_2d(coupler);\n        color(current)\n            _hub75_horizontal_edge_design_thin(0.02, 0.42)\n                difference() {\n                    _hub75_horizontal_edge_coupler_structural_profile_2d(coupler);\n                    _hub75_horizontal_edge_coupler_profile_2d(coupler);\n                }\n\n'''
          adapter = replace_once(adapter, profile_t_branch, support_branch, 'adapter support view')
          adapter_path.write_text(adapter)

          design = design_path.read_text()
          start = design.index('## 7. Extrude the T into the base plate')
          end = design.index('## 8. Cut the two mounting screw bores')
          step7 = '''## 7. Preserve structural material around the reinforcement clearances\n\nThe small preset uses a thinner T arm, while the physical reinforcement\nbushings keep the same diameter. If the base and later guide shell are clipped\nonly by the nominal T, the circular bushing clearance can consume most of the\navailable wall.\n\nThe structural profile therefore starts with the normal T and unions a local\nsupport envelope at each reinforcement position. Its diameter is derived from\nthe real clearance plus one configured wall thickness on every side:\n\n```text\nsupport diameter\n    reinforcement outside diameter\n  + 2 × reinforcement clearance\n  + 2 × wall thickness\n```\n\nThe image intentionally uses the **small** preset. Gray is the unchanged family\nT; red is only the extra area required by the support envelope. On a wider\npreset the same rule naturally adds nothing where the normal T already contains\nthe envelope.\n\n<!-- scad-render\nview: reinforcement-support-profile\nvpr: [0, 0, 0]\nvpt: [0, 0, -12]\n-->\n\nThe panel-derived dimensions are exposed by:\n\n```scad\nhub75_horizontal_edge_coupler_reinforcement_relief_diameter(coupler)\nhub75_horizontal_edge_coupler_reinforcement_support_diameter(coupler)\n```\n\nand production constructs the load-bearing 2D footprint with:\n\n```scad\n_hub75_horizontal_edge_coupler_reinforcement_support_envelope_2d(coupler)\n_hub75_horizontal_edge_coupler_structural_profile_2d(coupler)\n```\n\nThat structural profile is then extruded into the base plate:\n\n```scad\n_hub75_horizontal_edge_coupler_base_solid(coupler)\n```\n\nThe normal `_hub75_horizontal_edge_coupler_profile_2d()` remains the visible\nfamily reference shape and still clips the reference markings. The local\nstructural extension exists only where the physical reinforcement clearance\nrequires more material.\n\n'''
          design = design[:start] + step7 + design[end:]

          start = design.index('## 16. Reserve space around the reinforcement features')
          end = design.index('## 17. Extrude the finished guide system')
          step16 = '''## 16. Keep a full guide wall around the reinforcement features\n\nTwo panel reinforcement features overlap the inward raised guide. A simple\nsubtraction from the nominal T works for the broader presets, but in the small\npreset that circular cut removes most of the raised edge.\n\nThe structural support envelope introduced in step 7 is therefore also the\nstarting boundary for the guide shell. The normal panel keep-out is still\nsubtracted first, so the locally widened guide cannot grow back into the rear\nrail. The real reinforcement clearance is then removed from that supported\nguide.\n\n```text\nouter support radius\n    physical reinforcement radius\n  + reinforcement clearance\n  + wall thickness\n\ninner cleared radius\n    physical reinforcement radius\n  + reinforcement clearance\n```\n\nThis guarantees the requested wall thickness around the circular clearance\nwhere free space exists. It is not a `small` special case: if a wider T already\ncontains the support envelope, the union leaves its outside contour unchanged.\n\nThe first image shows the production Boolean construction: gray is the\nunrelieved supported guide and red is the pair of cylindrical removal volumes.\n\n<!-- scad-render\nview: guide-reinforcement-reliefs\nalt: Horizontal-edge supported guide and reinforcement relief construction\n-->\n\nThe second image explains the physical reason at one location. Dark gray is the\npanel reinforcement, light gray the still-unrelieved supported guide,\ntransparent red the required clearance band and bright red the guide material\nthat must be removed.\n\n<!-- scad-render\nview: guide-reinforcement-detail\nalt: Horizontal-edge HUB75 reinforcement and supported guide clearance detail\nsize: [480, 360]\n-->\n\nProduction uses the shared relief diameter:\n\n```scad\nhub75_horizontal_edge_coupler_reinforcement_relief_diameter(coupler)\n```\n\nand performs the final cylindrical subtraction inside:\n\n```scad\n_hub75_horizontal_edge_coupler_guide_walls(coupler)\n```\n\nusing panel-derived positions from:\n\n```scad\n_hub75_horizontal_edge_coupler_reinforcement_positions(coupler)\n```\n\nThe documentation adapter retains a named explanatory cutter only to visualize\nthis embedded production Boolean.\n\n'''
          design = design[:start] + step16 + design[end:]
          design_path.write_text(design)

          changelog = changelog_path.read_text()
          marker = '''- Defer generic branch, pull-request and publication workflow guidance to the\n  pinned `tools/tool.scad-project/AGENTS.md`; keep the root `AGENTS.md` focused\n  on HUB75 display-frame project-specific policy.\n'''
          addition = marker + '''- Preserve the configured horizontal-edge guide wall around panel reinforcement\n  clearances by locally expanding the structural profile from the real bushing\n  clearance plus `wall_thickness`; wider presets remain unchanged wherever the\n  existing T already contains that support envelope.\n'''
          changelog = replace_once(changelog, marker, addition, 'changelog reinforcement note')
          changelog_path.write_text(changelog)

          if note_path.exists():
              note_path.unlink()
          workflow_path.unlink()
          PY

      - name: Commit refinement to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve horizontal guide around reinforcement"
          git push origin HEAD:feature/pr-25-horizontal-edge-reinforcement-outline
