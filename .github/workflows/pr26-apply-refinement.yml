name: PR26 apply refinement

on:
  push:
    branches:
      - feature/pr-26-corner-taper-thin-sections

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v4
        with:
          ref: feature/pr-26-corner-taper-thin-sections
          fetch-depth: 0

      - name: Apply corner taper and verification refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          source = "dsg/openscad/project_components/corner-edge-coupler/hub75_corner_edge_coupler.scad"
          render = "dsg/openscad/project_components/corner-edge-coupler/hub75_corner_edge_coupler_render.scad"
          design = "dsg/openscad/project_components/corner-edge-coupler/design/design.md"
          fixture = "dsg/openscad/assemblies/verification/corner_edge_coupler_fit_assembly.scad"
          verify = "scripts/run-verification.sh"
          changelog = "CHANGELOG.md"

          replace_once(source,
          '''        rear_opening_corner_radius =
                      hub75_p5_64x32_panel_rear_opening_corner_radius(panel),
          
                  mounting_tube_outer_diameter =''',
          '''        rear_opening_corner_radius =
                      hub75_p5_64x32_panel_rear_opening_corner_radius(panel),
                  panel_taper_depth = hub75_rear_taper_depth(panel),
                  panel_rear_outer_inset_x =
                      hub75_p5_64x32_panel_rear_outer_inset_x(panel),
                  panel_rear_outer_inset_z =
                      hub75_p5_64x32_panel_rear_outer_inset_z(panel),
          
                  mounting_tube_outer_diameter =''')

          marker = '''// ----------------------------------------------------------------------
          // Base and functional cutters
          // ----------------------------------------------------------------------
          '''
          support = '''// ----------------------------------------------------------------------
          // Reinforcement support envelope
          // ----------------------------------------------------------------------
          
          function hub75_corner_edge_coupler_reinforcement_relief_diameter(coupler) =
              coupler.reinforcement_bushing_outer_diameter
              + 2 * coupler.reinforcement_bushing_clearance;
          
          function hub75_corner_edge_coupler_reinforcement_support_diameter(coupler) =
              hub75_corner_edge_coupler_reinforcement_relief_diameter(coupler)
              + 2 * coupler.wall_thickness;
          
          module _hub75_corner_edge_coupler_reinforcement_support_envelope_2d(coupler) {
              position = hub75_corner_edge_coupler_reinforcement_position(coupler);
          
              translate(position)
                  circle(
                      d = hub75_corner_edge_coupler_reinforcement_support_diameter(coupler)
                  );
          }
          
          module _hub75_corner_edge_coupler_structural_profile_2d(
              coupler,
              outside_radius_override = undef
          ) {
              union() {
                  _hub75_corner_edge_coupler_profile_2d(
                      coupler,
                      outside_radius_override = outside_radius_override
                  );
                  _hub75_corner_edge_coupler_reinforcement_support_envelope_2d(coupler);
              }
          }
          
          
          ''' + marker
          replace_once(source, marker, support)

          replace_once(source,
          '''module _hub75_corner_edge_coupler_base_solid(coupler) {
              _hub75_corner_edge_coupler_extrude_xz_y(
                  0,
                  coupler.base_thickness
              )
                  _hub75_corner_edge_coupler_profile_2d(coupler);
          }''',
          '''module _hub75_corner_edge_coupler_base_solid(coupler) {
              _hub75_corner_edge_coupler_extrude_xz_y(
                  0,
                  coupler.base_thickness
              )
                  _hub75_corner_edge_coupler_structural_profile_2d(coupler);
          }''')

          replace_once(source,
          '''        difference() {
                      _hub75_corner_edge_coupler_profile_2d(coupler);
          
                      offset(delta = coupler.fit_clearance)
                          _hub75_corner_edge_coupler_panel_keepout_2d(coupler);
                  }
          
                  // This mask can only trim the free ends; it never expands the fitted
                  // shell, so the 2 mm small wall cannot be eroded by offset(-r).
                  _hub75_corner_edge_coupler_profile_2d(
                      coupler,
                      outside_radius_override = effective_rounding
                  );''',
          '''        difference() {
                      _hub75_corner_edge_coupler_structural_profile_2d(coupler);
          
                      offset(delta = coupler.fit_clearance)
                          _hub75_corner_edge_coupler_panel_keepout_2d(coupler);
                  }
          
                  // This mask can only trim the free ends; it never expands the fitted
                  // shell, so the 2 mm small wall cannot be eroded by offset(-r).
                  // The reinforcement support envelope is retained independently of the
                  // cosmetic free-end rounding.
                  _hub75_corner_edge_coupler_structural_profile_2d(
                      coupler,
                      outside_radius_override = effective_rounding
                  );''')

          replace_once(source,
          '''module _hub75_corner_edge_coupler_horizontal_outer_zone_2d(coupler) {
              span = 2 * coupler.profile_size + 80;
              boundary =
                  coupler.rear_outer_edge_z
                  + coupler.fit_clearance;
          
              translate([0, boundary + span / 2])
                  square([span, span], center = true);
          }
          
          
          module _hub75_corner_edge_coupler_vertical_outer_zone_2d(coupler) {
              span = 2 * coupler.profile_size + 80;
              boundary =
                  coupler.rear_outer_edge_x
                  - coupler.x_inward * coupler.fit_clearance;
          
              if (coupler.side == "left")
                  translate([boundary - span / 2, 0])
                      square([span, 2 * span], center = true);
              else
                  translate([boundary + span / 2, 0])
                      square([span, 2 * span], center = true);
          }''',
          '''module _hub75_corner_edge_coupler_horizontal_outer_zone_2d(
              coupler,
              panel_shift_z = 0
          ) {
              span = 2 * coupler.profile_size + 80;
              boundary =
                  coupler.rear_outer_edge_z
                  + coupler.fit_clearance
                  + panel_shift_z;
          
              translate([0, boundary + span / 2])
                  square([span, span], center = true);
          }
          
          
          module _hub75_corner_edge_coupler_vertical_outer_zone_2d(
              coupler,
              panel_shift_x = 0
          ) {
              span = 2 * coupler.profile_size + 80;
              boundary =
                  coupler.rear_outer_edge_x
                  - coupler.x_inward * (coupler.fit_clearance + panel_shift_x);
          
              if (coupler.side == "left")
                  translate([boundary - span / 2, 0])
                      square([span, 2 * span], center = true);
              else
                  translate([boundary + span / 2, 0])
                      square([span, 2 * span], center = true);
          }
          
          
          module _hub75_corner_edge_coupler_horizontal_outer_ridge_2d(
              coupler,
              panel_shift_z = 0
          ) {
              intersection() {
                  _hub75_corner_edge_coupler_guide_shell_2d(coupler);
                  _hub75_corner_edge_coupler_horizontal_outer_zone_2d(
                      coupler,
                      panel_shift_z
                  );
              }
          }
          
          
          module _hub75_corner_edge_coupler_vertical_outer_ridge_2d(
              coupler,
              panel_shift_x = 0
          ) {
              intersection() {
                  _hub75_corner_edge_coupler_guide_shell_2d(coupler);
                  _hub75_corner_edge_coupler_vertical_outer_zone_2d(
                      coupler,
                      panel_shift_x
                  );
              }
          }''')

          replace_once(source,
          '''                    d =
                                  coupler.reinforcement_bushing_outer_diameter
                                  + 2 * coupler.reinforcement_bushing_clearance,''',
          '''                    d =
                                  hub75_corner_edge_coupler_reinforcement_relief_diameter(
                                      coupler
                                  ),''')

          replace_once(source,
          '''module _hub75_corner_edge_coupler_outer_ridges(coupler) {
              // The outside portions are part of the same guide system as the inward
              // portions. Their height is therefore exactly guide_height (4 / 6 / 10 mm).
              // Keep the shape straight for now; the final taper remains deferred until
              // the tube/clip geometry is introduced.
              _hub75_corner_edge_coupler_extrude_xz_y(
                  -coupler.guide_height,
                  0
              )
                  intersection() {
                      _hub75_corner_edge_coupler_guide_shell_2d(coupler);
          
                      union() {
                          _hub75_corner_edge_coupler_horizontal_outer_zone_2d(coupler);
                          _hub75_corner_edge_coupler_vertical_outer_zone_2d(coupler);
                      }
                  }
          }''',
          '''module _hub75_corner_edge_coupler_horizontal_outer_ridge(coupler) {
              ridge_h = coupler.guide_height;
              taper_h = min(ridge_h, coupler.panel_taper_depth);
              taper_shift_z = hub75_panel_taper_shift_at_depth(
                  taper_h,
                  coupler.panel_taper_depth,
                  coupler.panel_rear_outer_inset_z
              );
          
              union() {
                  hull() {
                      _hub75_corner_edge_coupler_extrude_xz_y(
                          -_HUB75_CORNER_EDGE_COUPLER_EPS,
                          _HUB75_CORNER_EDGE_COUPLER_EPS
                      )
                          _hub75_corner_edge_coupler_horizontal_outer_ridge_2d(
                              coupler,
                              0
                          );
          
                      _hub75_corner_edge_coupler_extrude_xz_y(
                          -taper_h - _HUB75_CORNER_EDGE_COUPLER_EPS,
                          -taper_h + _HUB75_CORNER_EDGE_COUPLER_EPS
                      )
                          _hub75_corner_edge_coupler_horizontal_outer_ridge_2d(
                              coupler,
                              taper_shift_z
                          );
                  }
          
                  if (ridge_h > taper_h)
                      _hub75_corner_edge_coupler_extrude_xz_y(
                          -ridge_h - _HUB75_CORNER_EDGE_COUPLER_EPS,
                          -taper_h + _HUB75_CORNER_EDGE_COUPLER_EPS
                      )
                          _hub75_corner_edge_coupler_horizontal_outer_ridge_2d(
                              coupler,
                              taper_shift_z
                          );
              }
          }
          
          
          module _hub75_corner_edge_coupler_vertical_outer_ridge(coupler) {
              ridge_h = coupler.guide_height;
              taper_h = min(ridge_h, coupler.panel_taper_depth);
              taper_shift_x = hub75_panel_taper_shift_at_depth(
                  taper_h,
                  coupler.panel_taper_depth,
                  coupler.panel_rear_outer_inset_x
              );
          
              union() {
                  hull() {
                      _hub75_corner_edge_coupler_extrude_xz_y(
                          -_HUB75_CORNER_EDGE_COUPLER_EPS,
                          _HUB75_CORNER_EDGE_COUPLER_EPS
                      )
                          _hub75_corner_edge_coupler_vertical_outer_ridge_2d(
                              coupler,
                              0
                          );
          
                      _hub75_corner_edge_coupler_extrude_xz_y(
                          -taper_h - _HUB75_CORNER_EDGE_COUPLER_EPS,
                          -taper_h + _HUB75_CORNER_EDGE_COUPLER_EPS
                      )
                          _hub75_corner_edge_coupler_vertical_outer_ridge_2d(
                              coupler,
                              taper_shift_x
                          );
                  }
          
                  if (ridge_h > taper_h)
                      _hub75_corner_edge_coupler_extrude_xz_y(
                          -ridge_h - _HUB75_CORNER_EDGE_COUPLER_EPS,
                          -taper_h + _HUB75_CORNER_EDGE_COUPLER_EPS
                      )
                          _hub75_corner_edge_coupler_vertical_outer_ridge_2d(
                              coupler,
                              taper_shift_x
                          );
              }
          }
          
          
          module _hub75_corner_edge_coupler_outer_ridges(coupler) {
              // Build each orthogonal ridge independently. Hulling the union of both
              // zones can bridge disconnected corner patches with a diagonal sheet.
              // Only the panel-facing edges move with the physical taper; the exposed
              // outside contour remains the fixed coupler profile.
              union() {
                  _hub75_corner_edge_coupler_horizontal_outer_ridge(coupler);
                  _hub75_corner_edge_coupler_vertical_outer_ridge(coupler);
              }
          }''')

          replace_once(render,
          '''module _hub75_corner_edge_design_raw_guide_shell_2d(coupler) {
              difference() {
                  _hub75_corner_edge_coupler_profile_2d(coupler);
                  offset(delta = coupler.fit_clearance)
                      _hub75_corner_edge_coupler_panel_keepout_2d(coupler);
              }
          }''',
          '''module _hub75_corner_edge_design_raw_guide_shell_2d(coupler) {
              difference() {
                  _hub75_corner_edge_coupler_structural_profile_2d(coupler);
                  offset(delta = coupler.fit_clearance)
                      _hub75_corner_edge_coupler_panel_keepout_2d(coupler);
              }
          }''')

          replace_once(render,
          '''module _hub75_corner_edge_design_outer_ridges_2d(coupler) {
              intersection() {
                  _hub75_corner_edge_coupler_guide_shell_2d(coupler);
                  union() {
                      _hub75_corner_edge_coupler_horizontal_outer_zone_2d(coupler);
                      _hub75_corner_edge_coupler_vertical_outer_zone_2d(coupler);
                  }
              }
          }''',
          '''module _hub75_corner_edge_design_outer_ridges_2d(
              coupler,
              panel_shift_x = 0,
              panel_shift_z = 0
          ) {
              union() {
                  _hub75_corner_edge_coupler_horizontal_outer_ridge_2d(
                      coupler,
                      panel_shift_z
                  );
                  _hub75_corner_edge_coupler_vertical_outer_ridge_2d(
                      coupler,
                      panel_shift_x
                  );
              }
          }
          
          module _hub75_corner_edge_design_straight_outer_ridges(coupler) {
              _hub75_corner_edge_coupler_extrude_xz_y(-coupler.guide_height, 0)
                  _hub75_corner_edge_design_outer_ridges_2d(coupler);
          }''')

          replace_once(render,
          '''    relief_diameter =
                  coupler.reinforcement_bushing_outer_diameter
                  + 2 * coupler.reinforcement_bushing_clearance;''',
          '''    relief_diameter =
                  hub75_corner_edge_coupler_reinforcement_relief_diameter(coupler);''')

          replace_once(render,
          '''module hub75_corner_edge_coupler_design(view = "final") {
              medium = hub75_corner_edge_coupler_create_for_size(side = "left", size = "medium");
              large = hub75_corner_edge_coupler_create_for_size(side = "left", size = "large");
              right_medium = hub75_corner_edge_coupler_create_for_size(side = "right", size = "medium");
              coupler = view == "locator-pin-clearance" ? large : medium;''',
          '''module hub75_corner_edge_coupler_design(view = "final") {
              small = hub75_corner_edge_coupler_create_for_size(side = "left", size = "small");
              medium = hub75_corner_edge_coupler_create_for_size(side = "left", size = "medium");
              large = hub75_corner_edge_coupler_create_for_size(side = "left", size = "large");
              right_medium = hub75_corner_edge_coupler_create_for_size(side = "right", size = "medium");
              coupler =
                  view == "locator-pin-clearance"
                      ? large
                      : view == "reinforcement-support-profile"
                          ? small
                          : medium;''')

          replace_once(render,
          '''    } else if (view == "locator-pin-clearance") {''',
          '''    } else if (view == "reinforcement-support-profile") {
                  color(existing)
                      _hub75_corner_edge_design_thin(-0.42, -0.02)
                          _hub75_corner_edge_coupler_profile_2d(coupler);
                  color(current)
                      _hub75_corner_edge_design_thin(0.02, 0.42)
                          difference() {
                              _hub75_corner_edge_coupler_structural_profile_2d(coupler);
                              _hub75_corner_edge_coupler_profile_2d(coupler);
                          }
          
              } else if (view == "locator-pin-clearance") {''')

          replace_once(render,
          '''    } else if (view == "guide-reinforcement-relief") {''',
          '''    } else if (view == "guide-taper") {
                  color(existing_transparent)
                      _hub75_corner_edge_design_straight_outer_ridges(coupler);
                  color(current)
                      _hub75_corner_edge_coupler_outer_ridges(coupler);
          
              } else if (view == "guide-reinforcement-relief") {''')

          replace_once(design,
          '''   rounded asymmetric profile
                     ↓
                  extrude base''',
          '''   rounded asymmetric profile
                     ↓
                  reinforcement support envelope where required
                     ↓
                  extrude base''')

          replace_once(design,
          '''   split inward guide / two outside ridges
                     ↓
                  reinforcement relief
                     ↓
                  complete guide system''',
          '''   split inward guide / two outside ridges
                     ↓
                  panel-derived X/Z taper on the two outside ridges
                     ↓
                  reinforcement support + relief
                     ↓
                  complete guide system''')

          replace_once(design,
          '''## 6. Extrude the profile into the base plate
          
          The completed 2D corner profile is extruded from the panel mounting plane toward
          the back of the display:
          
          ```text
          Y = 0
              ↓
          Y = base_thickness
          ```
          
          <!-- scad-render
          view: base
          -->
          
          The production module is:
          
          ```scad
          module _hub75_corner_edge_coupler_base_solid(coupler) {
              _hub75_corner_edge_coupler_extrude_xz_y(
                  0,
                  coupler.base_thickness
              )
                  _hub75_corner_edge_coupler_profile_2d(coupler);
          }
          ```''',
          '''## 6. Preserve structural material and extrude the base plate
          
          The physical corner reinforcement keeps the same diameter for every family
          preset. On the 2 mm small profile, subtracting its required clearance from the
          nominal corner shape can otherwise leave less than one configured wall thickness.
          
          Production therefore defines a local structural support envelope:
          
          ```text
          reinforcement support diameter
              physical bushing outside diameter
            + 2 × reinforcement clearance
            + 2 × wall thickness
          ```
          
          The image deliberately uses the **small** preset. Gray is the unchanged family
          profile; red is only the extra structural footprint required around the physical
          reinforcement position. Wider presets gain nothing where their existing arm
          already contains that envelope.
          
          <!-- scad-render
          view: reinforcement-support-profile
          vpr: [0, 0, 0]
          vpt: [8, 0, -8]
          -->
          
          Production exposes and constructs this footprint through:
          
          ```scad
          hub75_corner_edge_coupler_reinforcement_relief_diameter(coupler)
          hub75_corner_edge_coupler_reinforcement_support_diameter(coupler)
          _hub75_corner_edge_coupler_reinforcement_support_envelope_2d(coupler)
          _hub75_corner_edge_coupler_structural_profile_2d(coupler)
          ```
          
          That structural profile is then extruded from the panel mounting plane toward
          the back of the display:
          
          ```text
          Y = 0
              ↓
          Y = base_thickness
          ```
          
          <!-- scad-render
          view: base
          -->
          
          The production module is:
          
          ```scad
          _hub75_corner_edge_coupler_base_solid(coupler)
          ```
          
          The normal `_hub75_corner_edge_coupler_profile_2d()` remains the family reference
          contour used for surface markings; the support extension exists only where the
          physical reinforcement requires extra load-bearing material.''')

          replace_once(design,
          '''The outside portions are intentionally still straight through Y in this
          milestone. Unlike the horizontal-edge ridge, their final panel-taper treatment
          is deferred together with the future tube/clip system.''',
          '''At the rear mounting plane these zones are the starting footprints of the two
          outside ridges. Their panel-facing edges cannot remain at those coordinates as the
          guide advances toward the front: the real HUB75 outer faces widen continuously in
          both X and Z.
          
          Production therefore treats the two ridges independently. The horizontal ridge
          moves only its panel-facing Z edge by the real panel Z taper; the vertical ridge
          moves only its panel-facing X edge by the real panel X taper. Their exposed outside
          coupler contour remains stationary, so each ridge becomes slightly thinner with
          insertion depth instead of the complete wall leaning outward.
          
          Gray in the next image is the old documentation-only straight extrusion of the
          rear footprints. Red is the actual tapered production geometry.
          
          <!-- scad-render
          view: guide-taper
          vpr: [68, 0, 35]
          vpt: [8, -2, -8]
          -->
          
          The panel-derived inputs are:
          
          ```scad
          coupler.panel_taper_depth
          coupler.panel_rear_outer_inset_x
          coupler.panel_rear_outer_inset_z
          hub75_panel_taper_shift_at_depth(...)
          ```
          
          and the two ridges are built separately by:
          
          ```scad
          _hub75_corner_edge_coupler_horizontal_outer_ridge(coupler)
          _hub75_corner_edge_coupler_vertical_outer_ridge(coupler)
          ```
          
          They are only unioned afterwards in
          `_hub75_corner_edge_coupler_outer_ridges(coupler)`. This independent construction
          is deliberate: hulling the union of disconnected horizontal/vertical ridge patches
          was the cause of the earlier diagonal-sheet failure.''')

          old_relief_start = '''## 14. Reserve space around the corner reinforcement'''
          old_relief_end = '''## 15. Extrude the complete corner guide system'''
          p = Path(design)
          text = p.read_text(encoding="utf-8")
          start = text.index(old_relief_start)
          end = text.index(old_relief_end)
          relief_block = '''## 14. Preserve a full wall around the corner reinforcement
          
          The support envelope introduced in step 6 is also used as the starting boundary
          of the fitted guide shell. The real panel keep-out is still subtracted first, so
          the local extension cannot grow back into panel material.
          
          The remaining circular clearance uses:
          
          ```text
          inner cleared diameter
              physical reinforcement outside diameter
            + 2 × reinforcement clearance
          
          outer support diameter
              inner cleared diameter
            + 2 × wall thickness
          ```
          
          This is the same rule as the horizontal-edge family: it is not a small-only patch.
          If medium or large already contain the required envelope, their visible contour is
          unchanged.
          
          The first image shows the supported construction in the small preset. Gray is the
          normal family profile and red is only the extra support footprint.
          
          <!-- scad-render
          view: reinforcement-support-profile
          vpr: [0, 0, 0]
          vpt: [8, 0, -8]
          -->
          
          The next image keeps the coupler construction visible: gray is the supported
          unrelieved guide; red is the cylindrical material-removal volume.
          
          <!-- scad-render
          view: guide-reinforcement-relief
          alt: Corner supported guide reinforcement relief construction
          -->
          
          The detail image explains the physical reason. Dark gray is the HUB75
          reinforcement feature, light gray the supported guide, transparent red the
          required clearance band and bright red exactly the guide material that must be
          removed.
          
          <!-- scad-render
          view: guide-reinforcement-detail
          alt: Corner HUB75 reinforcement and supported guide clearance detail
          size: [480, 360]
          -->
          
          Production uses:
          
          ```scad
          hub75_corner_edge_coupler_reinforcement_relief_diameter(coupler)
          hub75_corner_edge_coupler_reinforcement_support_diameter(coupler)
          hub75_corner_edge_coupler_reinforcement_position(coupler)
          _hub75_corner_edge_coupler_guide_walls(coupler)
          ```
          
          The documentation adapter gives the embedded cylindrical subtraction a temporary
          named helper only so the Boolean operation can be shown independently.
          
          '''
          p.write_text(text[:start] + relief_block + text[end:], encoding="utf-8")

          replace_once(design,
          '''The inward guide is now extruded to `guide_height` with the reinforcement relief
          removed. The two outside ridge regions are extruded to the same height.''',
          '''The inward guide is extruded to `guide_height` with the reinforcement relief
          removed. The two outside ridge regions use that same 4 / 6 / 10 mm height, while
          their panel-facing X/Z edges follow the continuous physical taper described in
          step 13.''')

          replace_once(design,
          '''The latter remains deliberately straight for now. That deferred taper is a
          known design boundary, not an accidental omission in the documentation.''',
          '''The latter unions two independently tapered ridges; it never hulls the combined
          horizontal/vertical ridge set.''')

          replace_once(design,
          '''Left and right verification entrypoints provide local fit details and rear
          sections. As with the other connector families:''',
          '''Left and right verification entrypoints provide local fit details plus three
          true **0.10 mm** fit slices for every size:
          
          ```text
          rear-fit XZ slice
              shows the complete corner relationship at the selected insertion depth
          
          YZ top-edge slice
              shows the horizontal ridge against the physical Z taper
          
          XY side-edge slice
              shows the vertical ridge against the physical X taper
          ```
          
          The slices cut on both sides of the selected section plane instead of retaining a
          complete half-space. That keeps the red/gray mating contours readable even where
          the physical outer wall is sloped.
          
          As with the other connector families:''')

          replace_once(design,
          '''The aluminium tube, corner C-clip and final taper treatment of the two outside
          ridges remain intentionally deferred. The straight outer ridges shown above are
          therefore the current explicit production state, not an undocumented final
          assumption.''',
          '''The aluminium tube and corner C-clip remain intentionally deferred. The panel-fit
          geometry of the corner body, including both outside-ridge tapers, is now explicit
          and independently verifiable before that reinforcement hardware is introduced.''')

          # Replace the rear-fit half-space implementation and append orthogonal 0.10 mm slices.
          p = Path(fixture)
          text = p.read_text(encoding="utf-8")
          marker = '''// Module: hub75_corner_edge_coupler_rear_fit_section()'''
          start = text.index(marker)
          prefix = text[:start]
          replacement = r'''// Module: hub75_corner_edge_coupler_rear_fit_section()
          // Description:
          //   Rear-facing 0.10 mm XZ slice through the physical corner. Grey is panel
          //   structure; red is coupler material in exactly the same thin section.
          module hub75_corner_edge_coupler_rear_fit_section(
              side = "left",
              panel = hub75_p5_64x32_panel_create(),
              coupler = undef,
              depth = 5.0,
              slice_thickness = 0.10,
              crop_inward = 105,
              crop_outward = 10
          ) {
              active_coupler =
                  is_undef(coupler)
                      ? hub75_corner_edge_coupler_create(side = side, panel = panel)
                      : coupler;
          
              corner_x = _hub75_corner_edge_fit_corner_x(panel, side);
              corner_z = _hub75_corner_edge_fit_corner_z(panel);
              mounting_y = hub75_p5_64x32_panel_mounting_plane_y(panel);
              section_y = mounting_y - depth;
              x_min = side == "left" ? corner_x - crop_outward : corner_x - crop_inward;
              x_max = side == "left" ? corner_x + crop_inward : corner_x + crop_outward;
          
              assert(depth > 0, "rear fit section depth must be > 0");
              assert(slice_thickness > 0, "rear fit slice thickness must be > 0");
              assert(
                  section_y - slice_thickness / 2 > 0,
                  "rear fit slice must remain behind the HUB75 front face"
              );
          
              module _slice_volume() {
                  translate([
                      x_min,
                      section_y - slice_thickness / 2,
                      corner_z - crop_inward
                  ])
                      cube([
                          x_max - x_min,
                          slice_thickness,
                          crop_inward + crop_outward
                      ]);
              }
          
              color([0.68, 0.68, 0.68, 1])
                  intersection() {
                      _hub75_corner_edge_fit_panel(panel, structure_only = true);
                      _slice_volume();
                  }
          
              color([0.72, 0.05, 0.04, 1])
                  intersection() {
                      translate([corner_x, mounting_y, corner_z])
                          hub75_corner_edge_coupler_build(active_coupler);
                      _slice_volume();
                  }
          
              hub75_verification_datum_pin(
                  x = corner_x,
                  z = corner_z,
                  y_min = section_y - 2,
                  y_max = section_y + 2
              );
          }
          
          
          // Module: hub75_corner_edge_coupler_yz_top_edge_section()
          // Description:
          //   0.10 mm YZ slice through the horizontal outside ridge, safely inward from
          //   the corner screw/reinforcement feature.
          module hub75_corner_edge_coupler_yz_top_edge_section(
              side = "left",
              panel = hub75_p5_64x32_panel_create(),
              coupler = undef,
              slice_inward = 20,
              slice_thickness = 0.10,
              crop_inward = 60,
              crop_outward = 10
          ) {
              active_coupler =
                  is_undef(coupler)
                      ? hub75_corner_edge_coupler_create(side = side, panel = panel)
                      : coupler;
              corner_x = _hub75_corner_edge_fit_corner_x(panel, side);
              corner_z = _hub75_corner_edge_fit_corner_z(panel);
              mounting_y = hub75_p5_64x32_panel_mounting_plane_y(panel);
              x_inward = side == "left" ? 1 : -1;
              slice_x = corner_x + x_inward * slice_inward;
              y_max = mounting_y + active_coupler.base_thickness + 2;
          
              assert(slice_thickness > 0, "top-edge slice thickness must be > 0");
          
              module _slice_volume() {
                  translate([
                      slice_x - slice_thickness / 2,
                      -0.5,
                      corner_z - crop_inward
                  ])
                      cube([
                          slice_thickness,
                          y_max + 1,
                          crop_inward + crop_outward
                      ]);
              }
          
              color([0.68, 0.68, 0.68, 1])
                  intersection() {
                      _hub75_corner_edge_fit_panel(panel, structure_only = true);
                      _slice_volume();
                  }
          
              color([0.72, 0.05, 0.04, 1])
                  intersection() {
                      translate([corner_x, mounting_y, corner_z])
                          hub75_corner_edge_coupler_build(active_coupler);
                      _slice_volume();
                  }
          }
          
          
          // Module: hub75_corner_edge_coupler_xy_side_edge_section()
          // Description:
          //   0.10 mm XY slice through the vertical outside ridge, safely inward from the
          //   corner screw/reinforcement feature.
          module hub75_corner_edge_coupler_xy_side_edge_section(
              side = "left",
              panel = hub75_p5_64x32_panel_create(),
              coupler = undef,
              slice_inward = 20,
              slice_thickness = 0.10,
              crop_inward = 60,
              crop_outward = 10
          ) {
              active_coupler =
                  is_undef(coupler)
                      ? hub75_corner_edge_coupler_create(side = side, panel = panel)
                      : coupler;
              corner_x = _hub75_corner_edge_fit_corner_x(panel, side);
              corner_z = _hub75_corner_edge_fit_corner_z(panel);
              mounting_y = hub75_p5_64x32_panel_mounting_plane_y(panel);
              slice_z = corner_z - slice_inward;
              y_max = mounting_y + active_coupler.base_thickness + 2;
              x_min = side == "left" ? corner_x - crop_outward : corner_x - crop_inward;
              x_max = side == "left" ? corner_x + crop_inward : corner_x + crop_outward;
          
              assert(slice_thickness > 0, "side-edge slice thickness must be > 0");
          
              module _slice_volume() {
                  translate([
                      x_min,
                      -0.5,
                      slice_z - slice_thickness / 2
                  ])
                      cube([
                          x_max - x_min,
                          y_max + 1,
                          slice_thickness
                      ]);
              }
          
              color([0.68, 0.68, 0.68, 1])
                  intersection() {
                      _hub75_corner_edge_fit_panel(panel, structure_only = true);
                      _slice_volume();
                  }
          
              color([0.72, 0.05, 0.04, 1])
                  intersection() {
                      translate([corner_x, mounting_y, corner_z])
                          hub75_corner_edge_coupler_build(active_coupler);
                      _slice_volume();
                  }
          }
          '''
          p.write_text(prefix + replacement, encoding="utf-8")

          replace_once(verify,
          '''  render_png \\
              "Corner-edge ${side} coupler ${size} rear fit section" \\
              "${size}" \\
              "${ROOT_DIR}/vrf/openscad/corner-edge-coupler-${side}-rear-fit-section.scad" \\
              "${PNG_DIR}/corner-edge-coupler-${side}-${size}-rear-fit-section.png"
          }''',
          '''  render_png \\
              "Corner-edge ${side} coupler ${size} rear fit section" \\
              "${size}" \\
              "${ROOT_DIR}/vrf/openscad/corner-edge-coupler-${side}-rear-fit-section.scad" \\
              "${PNG_DIR}/corner-edge-coupler-${side}-${size}-rear-fit-section.png"
          
            render_png \\
              "Corner-edge ${side} coupler ${size} YZ top-edge section" \\
              "${size}" \\
              "${ROOT_DIR}/vrf/openscad/corner-edge-coupler-${side}-yz-top-edge-section.scad" \\
              "${PNG_DIR}/corner-edge-coupler-${side}-${size}-yz-top-edge-section.png"
          
            render_png \\
              "Corner-edge ${side} coupler ${size} XY side-edge section" \\
              "${size}" \\
              "${ROOT_DIR}/vrf/openscad/corner-edge-coupler-${side}-xy-side-edge-section.scad" \\
              "${PNG_DIR}/corner-edge-coupler-${side}-${size}-xy-side-edge-section.png"
          }''')

          replace_once(changelog,
          '''- Preserve the configured horizontal-edge guide wall around panel reinforcement
            clearances by locally expanding the structural profile from the real bushing
            clearance plus `wall_thickness`; wider presets remain unchanged wherever the
            existing T already contains that support envelope.''',
          '''- Preserve the configured horizontal-edge guide wall around panel reinforcement
            clearances by locally expanding the structural profile from the real bushing
            clearance plus `wall_thickness`; wider presets remain unchanged wherever the
            existing T already contains that support envelope.
          - Apply the same panel-derived construction rules to the corner-edge family: the
            horizontal/vertical outside ridges now follow the real HUB75 Z/X taper only on
            their panel-facing edges, retain a straight exposed contour, and preserve a full
            configured wall around the reinforcement clearance where required.
          - Replace corner rear-fit half-space views with true 0.10 mm slices and add 0.10 mm
            YZ top-edge plus XY side-edge sections for direct verification of both orthogonal
            corner taper interfaces.''')

          # New side-specific section entrypoints.
          entry_template = r'''// {title}
          
          use <../../dsg/openscad/assemblies/verification/corner_edge_coupler_fit_assembly.scad>
          use <../../dsg/openscad/ext/lib.scad.hub75/openscad/p5-64x32-panel/hub75_p5_64x32_panel.scad>
          use <../../dsg/openscad/project_components/corner-edge-coupler/hub75_corner_edge_coupler.scad>
          
          size = "medium";
          side = "{side}";
          
          panel = hub75_p5_64x32_panel_create();
          coupler = hub75_corner_edge_coupler_create_for_size(side = side, size = size, panel = panel);
          corner_x = ({sign}) * hub75_p5_64x32_panel_nominal_width(panel) / 2;
          corner_z = hub75_p5_64x32_panel_nominal_height(panel) / 2;
          slice_inward = 20;
          {slice_coord}
          
          $vpt = {vpt};
          $vpr = {vpr};
          $vpd = size == "small" ? {small_d} : size == "large" ? {large_d} : {medium_d};
          
          {call}(
              side = side,
              panel = panel,
              coupler = coupler,
              slice_inward = slice_inward,
              slice_thickness = 0.10
          );
          '''
          for side, sign in (("left", "-1"), ("right", "1")):
              x_inward = "1" if side == "left" else "-1"
              yz = entry_template.format(
                  title=f"YZ top-edge fit section for the top-{side} corner.",
                  side=side,
                  sign=sign,
                  slice_coord=f"slice_x = corner_x + ({x_inward}) * slice_inward;",
                  vpt="[slice_x, 7, corner_z - 20]",
                  vpr="[0, 90, 0]" if side == "left" else "[0, -90, 0]",
                  small_d=145,
                  large_d=205,
                  medium_d=170,
                  call="hub75_corner_edge_coupler_yz_top_edge_section"
              )
              Path(f"vrf/openscad/corner-edge-coupler-{side}-yz-top-edge-section.scad").write_text(yz, encoding="utf-8")
          
              xy = entry_template.format(
                  title=f"XY side-edge fit section for the top-{side} corner.",
                  side=side,
                  sign=sign,
                  slice_coord="slice_z = corner_z - slice_inward;",
                  vpt=f"[corner_x + ({x_inward}) * 20, 7, slice_z]",
                  vpr="[0, 0, 0]",
                  small_d=150,
                  large_d=215,
                  medium_d=180,
                  call="hub75_corner_edge_coupler_xy_side_edge_section"
              )
              Path(f"vrf/openscad/corner-edge-coupler-{side}-xy-side-edge-section.scad").write_text(xy, encoding="utf-8")
          PY

          rm -f .github/workflows/pr26-apply-refinement.yml

      - name: Commit refinement to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No refinement changes to commit"
            exit 0
          fi
          git commit -m "feat: refine corner taper and fit verification"
          git push origin HEAD:feature/pr-26-corner-taper-thin-sections
