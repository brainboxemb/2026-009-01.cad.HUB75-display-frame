project:
  name: 2026-009-01.cad.HUB75-display-frame

tooling:
  tool_scad_project:
    type: git-submodule
    url: https://github.com/brainboxemb/tool.scad-project.git
    path: tools/tool.scad-project
    ref: v0.6.1

paths:
  design_root: dsg
  build_root: bld

openscad:
  common_flags:
    - --enable=object-function
  render_flags:
    - --render
    - --projection=o
  image_size: [2560, 1440]
  design_image_size: [1000, 750]

rendering:
  watermark:
    text: "© 2026 brainboxemb"

externals:
  - name: lib.scad.hub75
    type: git-submodule
    url: https://github.com/brainboxemb/lib.scad.hub75.git
    path: dsg/openscad/ext/lib.scad.hub75
    ref: main
    required_file: openscad/p5-64x32-panel/hub75_p5_64x32_panel.scad

builds:
  - name: front-png
    source: dsg/openscad/render/front.scad
    output: bld/png/front.png

  - name: front-angled-png
    source: dsg/openscad/render/front-angled.scad
    output: bld/png/front-angled.png

  - name: rear-png
    source: dsg/openscad/render/rear.scad
    output: bld/png/rear.png

  - name: rear-angled-png
    source: dsg/openscad/render/rear-angled.scad
    output: bld/png/rear-angled.png

  - name: panels-assembly-stl
    source: dsg/openscad/export/panels-assembly.scad
    output: bld/stl/panels-assembly.stl

  - name: middle-coupler-png
    source: dsg/openscad/render/middle-coupler.scad
    output: bld/png/middle-coupler.png

  - name: middle-coupler-fit-png
    source: dsg/openscad/render/middle-coupler-fit.scad
    output: bld/png/middle-coupler-fit.png

  - name: middle-coupler-fit-section-png
    source: dsg/openscad/render/middle-coupler-fit-section.scad
    output: bld/png/middle-coupler-fit-section.png

  - name: middle-coupler-stl
    source: dsg/openscad/export/middle-coupler.scad
    output: bld/stl/middle-coupler.stl

publication:
  production:
    source_branch: main
    build_branch: build
    verification_branch: verification

  development:
    build_branch: dev/build
    verification_branch: dev/verification

  tags:
    pattern: "v*"
